<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Option C – Neural Signal Path</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #050508;
    font-family: 'SF Mono', 'Fira Code', monospace;
    color: #e8e8f0;
    min-height: 100vh;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .scene {
    width: 900px;
    height: 600px;
    position: relative;
    background: linear-gradient(135deg, rgba(139,92,246,0.1), transparent 40%),
                linear-gradient(225deg, rgba(34,211,238,0.07), transparent 40%),
                #050508;
    border: 1px solid rgba(255,255,255,0.06);
    overflow: hidden;
  }

  .label {
    position: absolute;
    top: 20px;
    left: 24px;
    font-size: 10px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: rgba(34,211,238,0.7);
    border: 1px solid rgba(34,211,238,0.2);
    padding: 4px 10px;
    background: rgba(0,0,0,0.4);
    z-index: 10;
  }

  /* ---- SVG neural path ---- */
  .neural-svg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
  }

  /* Nodes */
  .node {
    position: absolute;
    transform: translate(-50%, -50%);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 5;
  }

  .node-ring {
    width: 20px;
    height: 20px;
    border-radius: 50%;
    border: 1.5px solid rgba(139,92,246,0.6);
    background: rgba(5,5,10,0.9);
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    z-index: 2;
  }
  .node-ring::before {
    content: '';
    width: 6px; height: 6px;
    border-radius: 50%;
    background: rgba(139,92,246,0.7);
  }
  .node-ring.active {
    border-color: #22d3ee;
    box-shadow: 0 0 20px rgba(34,211,238,0.8), 0 0 40px rgba(34,211,238,0.3);
    width: 26px; height: 26px;
  }
  .node-ring.active::before {
    background: #22d3ee;
    width: 8px; height: 8px;
    box-shadow: 0 0 10px rgba(34,211,238,0.9);
  }

  /* Pulse dot traveling along path */
  .pulse {
    position: absolute;
    width: 5px; height: 5px;
    border-radius: 50%;
    background: #22d3ee;
    box-shadow: 0 0 10px rgba(34,211,238,1), 0 0 20px rgba(34,211,238,0.5);
    animation: travel 4s ease-in-out infinite;
    offset-path: path('M 450 60 C 350 130 550 200 450 270 C 350 340 550 410 450 480 C 400 520 420 540 450 560');
    animation-name: movePulse;
  }
  @keyframes movePulse {
    0% { offset-distance: 0%; opacity: 0; }
    5% { opacity: 1; }
    95% { opacity: 1; }
    100% { offset-distance: 100%; opacity: 0; }
  }

  /* Node cards */
  .node-card {
    position: absolute;
    transform: translateY(-50%);
    background: rgba(5,5,10,0.82);
    border: 1px solid rgba(139,92,246,0.18);
    padding: 10px 14px;
    width: 178px;
    backdrop-filter: blur(8px);
  }
  .node-card.active {
    border-color: rgba(34,211,238,0.3);
    background: rgba(34,211,238,0.035);
  }
  .nc-phase {
    font-size: 8px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: rgba(139,92,246,0.75);
    margin-bottom: 3px;
  }
  .node-card.active .nc-phase { color: rgba(34,211,238,0.9); }
  .nc-title {
    font-size: 12px;
    color: rgba(220,220,240,0.85);
    font-family: -apple-system, sans-serif;
    font-weight: 500;
  }
  .node-card.active .nc-title { color: #fff; }

  /* Branch lines from node to card */
  .branch {
    position: absolute;
    height: 1px;
    background: rgba(139,92,246,0.25);
    transform-origin: left center;
    z-index: 1;
  }
  .branch.active { background: rgba(34,211,238,0.4); }

  /* 3D Bust */
  .bust-wrap {
    position: absolute;
    right: 58px;
    top: 50%;
    transform: translateY(-50%);
    width: 200px;
    height: 260px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* Floating orb glow behind bust */
  .bust-glow {
    position: absolute;
    inset: -20px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(139,92,246,0.18) 0%, transparent 70%);
    animation: pulse-glow 3s ease-in-out infinite;
  }
  @keyframes pulse-glow {
    0%,100% { transform: scale(1); opacity: 0.8; }
    50% { transform: scale(1.08); opacity: 1; }
  }

  .bust-dots {
    width: 130px;
    height: 170px;
    position: relative;
    z-index: 2;
    background-image: radial-gradient(circle, rgba(159,246,255,0.75) 1px, transparent 1px),
                      radial-gradient(circle, rgba(183,162,255,0.55) 1px, transparent 1px);
    background-size: 8px 8px, 12px 12px;
    background-position: 0 0, 4px 6px;
    mask-image: radial-gradient(ellipse at 50% 38%, black 28%, rgba(0,0,0,0.7) 52%, transparent 72%);
    -webkit-mask-image: radial-gradient(ellipse at 50% 38%, black 28%, rgba(0,0,0,0.7) 52%, transparent 72%);
  }

  /* Floating node connections from bust to path */
  .bust-node {
    position: absolute;
    width: 8px; height: 8px;
    border-radius: 50%;
    border: 1px solid rgba(139,92,246,0.5);
    background: rgba(5,5,10,0.9);
  }
  .bust-node::before {
    content: ''; position: absolute;
    inset: 2px; border-radius: 50%;
    background: rgba(139,92,246,0.5);
  }

  /* HUD label under bust */
  .bust-label {
    position: absolute;
    bottom: -20px;
    left: 50%; transform: translateX(-50%);
    white-space: nowrap;
    font-size: 8px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: rgba(139,92,246,0.6);
  }
</style>
</head>
<body>
<div class="scene">
  <div class="label">Option C — Neural Signal Path</div>

  <!-- Neural path SVG -->
  <svg class="neural-svg" viewBox="0 0 900 600" fill="none" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="pathGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="rgba(139,92,246,0)" />
        <stop offset="15%" stop-color="rgba(139,92,246,0.6)" />
        <stop offset="45%" stop-color="rgba(34,211,238,0.85)" />
        <stop offset="75%" stop-color="rgba(139,92,246,0.55)" />
        <stop offset="100%" stop-color="rgba(139,92,246,0)" />
      </linearGradient>
      <!-- Glow filter -->
      <filter id="glow">
        <feGaussianBlur stdDeviation="3" result="blur"/>
        <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
    </defs>

    <!-- Main curved path -->
    <path
      d="M 420 55 C 320 130 520 200 420 275 C 320 350 520 415 420 490 C 380 525 400 548 420 565"
      stroke="url(#pathGrad)"
      stroke-width="1.5"
      fill="none"
      filter="url(#glow)"
    />

    <!-- Faint parallel path for depth -->
    <path
      d="M 424 55 C 324 130 524 200 424 275 C 324 350 524 415 424 490 C 384 525 404 548 424 565"
      stroke="rgba(139,92,246,0.12)"
      stroke-width="1"
      fill="none"
    />

    <!-- Branch lines to left nodes -->
    <line x1="414" y1="90"  x2="250" y2="90"  stroke="rgba(139,92,246,0.22)" stroke-width="1"/>
    <line x1="424" y1="230" x2="250" y2="230" stroke="rgba(34,211,238,0.5)"  stroke-width="1"/>
    <line x1="414" y1="380" x2="250" y2="380" stroke="rgba(139,92,246,0.22)" stroke-width="1"/>
    <line x1="424" y1="520" x2="250" y2="520" stroke="rgba(139,92,246,0.22)" stroke-width="1"/>

    <!-- Branch lines to right nodes -->
    <line x1="424" y1="160" x2="590" y2="160" stroke="rgba(139,92,246,0.22)" stroke-width="1"/>
    <line x1="414" y1="305" x2="590" y2="305" stroke="rgba(139,92,246,0.22)" stroke-width="1"/>
    <line x1="424" y1="450" x2="590" y2="450" stroke="rgba(139,92,246,0.22)" stroke-width="1"/>

    <!-- Node circles on path -->
    <circle cx="420" cy="90"  r="5" fill="#050508" stroke="rgba(139,92,246,0.7)" stroke-width="1.5"/>
    <circle cx="424" cy="160" r="5" fill="#050508" stroke="rgba(139,92,246,0.7)" stroke-width="1.5"/>
    <circle cx="424" cy="230" r="8" fill="#22d3ee" stroke="rgba(34,211,238,0.9)" stroke-width="2"
      style="filter:drop-shadow(0 0 8px rgba(34,211,238,0.9))"/>
    <circle cx="414" cy="305" r="5" fill="#050508" stroke="rgba(139,92,246,0.7)" stroke-width="1.5"/>
    <circle cx="414" cy="380" r="5" fill="#050508" stroke="rgba(139,92,246,0.7)" stroke-width="1.5"/>
    <circle cx="424" cy="450" r="5" fill="#050508" stroke="rgba(139,92,246,0.7)" stroke-width="1.5"/>
    <circle cx="424" cy="520" r="5" fill="#050508" stroke="rgba(139,92,246,0.7)" stroke-width="1.5"/>

    <!-- Traveling pulse (animated via CSS) -->
    <circle r="3.5" fill="#22d3ee" style="filter:drop-shadow(0 0 6px rgba(34,211,238,1))">
      <animateMotion dur="4s" repeatCount="indefinite"
        path="M 420 55 C 320 130 520 200 420 275 C 320 350 520 415 420 490 C 380 525 400 548 420 565"
        keyTimes="0;0.05;0.95;1" keySplines="0.4 0 0.6 1; 0.4 0 0.6 1; 0.4 0 0.6 1">
        <animate attributeName="opacity" values="0;1;1;0" dur="4s" repeatCount="indefinite"/>
      </animateMotion>
    </circle>
  </svg>

  <!-- Left node cards -->
  <div class="node-card" style="left: 62px; top: 90px;">
    <div class="nc-phase">Node 01 · Signal</div>
    <div class="nc-title">What I Do</div>
  </div>

  <div class="node-card active" style="left: 62px; top: 230px;">
    <div class="nc-phase">Node 03 · Active</div>
    <div class="nc-title">AI Signal Lab</div>
  </div>

  <div class="node-card" style="left: 62px; top: 380px;">
    <div class="nc-phase">Node 05 · Proof</div>
    <div class="nc-title">Experience</div>
  </div>

  <div class="node-card" style="left: 62px; top: 520px;">
    <div class="nc-phase">Node 07 · Launch</div>
    <div class="nc-title">Start</div>
  </div>

  <!-- Right node cards -->
  <div class="node-card" style="right: 62px; top: 160px; left: auto;">
    <div class="nc-phase">Node 02 · Route</div>
    <div class="nc-title">How I Help</div>
  </div>

  <div class="node-card" style="right: 62px; top: 305px; left: auto;">
    <div class="nc-phase">Node 04 · Pulse</div>
    <div class="nc-title">Results</div>
  </div>

  <div class="node-card" style="right: 62px; top: 450px; left: auto;">
    <div class="nc-phase">Node 06 · Map</div>
    <div class="nc-title">Case Studies</div>
  </div>

  <!-- Bust (floating, no frame) -->
  <div class="bust-wrap">
    <div class="bust-glow"></div>
    <div class="bust-dots"></div>
    <div class="bust-label">Felipe Mejia</div>
  </div>
</div>
</body>
</html>
